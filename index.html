<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'nonce-ragtime5500-local-runtime-v1'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <title>Ragtime 5500 — Offline Form 5500 Workbench</title>
  </head>
  <body>
    <div id="root">
      <main>
        <h1>Ragtime 5500</h1>
        <p>Starting the offline application locally…</p>
        <p>If this message remains on screen, this browser blocked the application runtime. The file itself opened successfully.</p>
      </main>
    </div>
    <noscript>Ragtime 5500 requires JavaScript enabled in the local browser.</noscript>
    <script nonce="ragtime5500-local-runtime-v1">
      (() => {
        const showStartupFailure = (message) => {
          const root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<main style="max-width:760px;margin:40px auto;padding:24px;font-family:system-ui;background:#080d13;color:#f3f0e8;border:1px solid #555;border-radius:12px">' +
            '<h1>Ragtime 5500 could not start</h1>' +
            '<p>The HTML file opened, but this browser blocked part of the local runtime.</p>' +
            '<pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#000;padding:12px;border-radius:8px">' +
            String(message).replace(/[&<>]/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch])) +
            '</pre><p>Use this exact message when reporting the failure.</p></main>';
        };
        window.addEventListener('error', (event) => showStartupFailure(event.error?.message || event.message || 'Unknown startup error'));
        window.addEventListener('unhandledrejection', (event) => showStartupFailure(event.reason?.message || String(event.reason || 'Unknown startup rejection')));

        const blocked = (name) => () => {
          throw new Error(`Network capability disabled by Ragtime 5500 security policy: ${name}`);
        };
        const g = globalThis;
        for (const name of ['fetch', 'XMLHttpRequest', 'WebSocket', 'EventSource', 'open']) {
          try {
            Object.defineProperty(g, name, {
              configurable: false,
              writable: false,
              value: blocked(name),
            });
          } catch {}
        }
        try {
          Object.defineProperty(navigator, 'sendBeacon', {
            configurable: false,
            writable: false,
            value: blocked('navigator.sendBeacon'),
          });
        } catch {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
