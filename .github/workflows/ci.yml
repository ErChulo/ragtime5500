name: Milestone 1 verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact declared dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Schema and backup test
        run: python3 tests/verify_schema.py

      - name: Production build
        run: npm run build

      - name: Zero-network source audit
        run: npm run audit:network
